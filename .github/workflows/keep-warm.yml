name: Keep Cloud Run warm and watch the live URL

# Both Cloud Run services run with min-instances=1, so they should never be
# cold; this ping is a second guard and, more usefully, an alarm: if the live
# URL stops answering for the whole retry window, the run goes red and GitHub
# emails the repository owner. That matters most during the judging period.
#
# The URLs are repository variables, not files, so they never land in the repo:
#   gh variable set API_URL --body "https://<api service url>"
#   gh variable set WEB_URL --body "https://<web service url>"
# Manual dispatch forces a check right before a demo.

"on":
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Check API health and web page
        run: |
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "::error::Set the API_URL and WEB_URL repository variables (see the comment at the top of this file)."
            exit 1
          fi
          check() {
            name="$1"; url="$2"
            for attempt in 1 2 3; do
              if curl -fsS -m 30 -o /dev/null -w "$name: HTTP %{http_code} in %{time_total}s\n" "$url"; then
                return 0
              fi
              echo "$name: attempt $attempt failed"
              sleep 10
            done
            echo "::error::$name did not answer after 3 attempts"
            return 1
          }
          status=0
          check "API /health" "${API_URL%/}/health" || status=1
          check "Web /" "${WEB_URL%/}/" || status=1
          exit $status
